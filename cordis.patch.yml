# dsh-feishu-plugin bundle patch.
# The row id `feishu` is stable: override its config from the profile's
# cordis.patch.yml instead of editing this file.
- insert:
    - id: feishu
      name: dsh-feishu-plugin
      config:
        # The plugin stays inert (and logs a warning) until both are set.
        appId: ''
        appSecret: ''
        domain: feishu
        # First user to message the bot becomes the owner when allowUsers is empty.
        allowUsers: []
        allowedRoots: []
        defaultDirectory: ''
        defaultModel:
          provider: ''
          model: ''
        defaultPermissionPreset: ''
        busyDelivery: queue
        acceptAttachments: true
        stream: true
        logLevel: info
        # Volatile switch on the plugin page; keeps the same log file.
        debugLog: false
