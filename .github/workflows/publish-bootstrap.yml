name: Publish to npm (bootstrap via NPM_TOKEN)

# **仅用于首次发布**（0.1.0）。
#
# 为什么需要它：npm 的 Trusted Publisher（OIDC）只能在**包已经存在**之后
# 到 npmjs.com 上配置，所以第一个版本必须先走传统 token 认证。
#
# 一次性流程：
#   1. npmjs.com → Access Tokens → 生成一个 granular token，
#      **只给 dsh-feishu-plugin 的 publish 权限**（不要给全账号）；
#   2. 存进本仓库：Settings → Secrets and variables → Actions → New secret，名字 `NPM_TOKEN`；
#   3. Actions 页面手动运行本 workflow → 完成 0.1.0 首发；
#   4. 到 npmjs.com → 包 → Settings → Publishing access → Trusted Publisher，配
#      owner=moyuanhua  repo=dsh-feishu-plugin  workflow=publish.yml；
#   5. **删掉本文件**，之后统一用 publish.yml（打 tag → OIDC + provenance，无 secret）；
#   6. npmjs.com → Settings → 开「Require 2FA and disallow tokens」，并撤销第 1 步的 token。
#
# 注意：这里**必须**设 registry-url —— setup-node 会据此把 NODE_AUTH_TOKEN 写进 .npmrc，
# 让我们走 token 认证（与 publish.yml 的刻意不设正好相反）。

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # provenance 仍需要 OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Upgrade npm
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Verify (typecheck + build + test)
        run: |
          pnpm run typecheck
          pnpm run build
          pnpm test

      - name: Publish (bootstrap token)
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
