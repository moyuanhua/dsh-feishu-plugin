name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 必须先装，setup-node 的 `cache: pnpm` 才有 pnpm 可用。
      # lockfileVersion 9.0 ← pnpm 10。
      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      # Node 24：package.json 的 engines 是 `^22.19.0 || >=24.0.0`，取上限最省事。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test

      # 覆盖率门槛写在 vitest.config.ts 里，跑一次确认没被悄悄放低。
      - run: pnpm run test:coverage

      # lib/ 是构建产物、不入库；这里确认它确实能被构建出来（从 git 装的人依赖这一步）。
      - name: Verify build output exists
        run: test -f lib/index.js && test -f cordis.patch.yml && test -f icon.svg
