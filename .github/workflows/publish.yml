name: Publish to npm

# 推 v* tag 即发布；也可以在 Actions 页面手动触发。
#
# 走 npm 的 Trusted Publishing（OIDC），不需要任何 secret，自动带 provenance。
# 前提（只在 npmjs.com 上配一次）：
#   npmjs.com → 包 dsh-feishu-plugin → Settings → Trusted Publisher
#     owner=moyuanhua  repo=dsh-feishu-plugin  workflow=publish.yml

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '12'

      # 故意不设 registry-url：否则 setup-node 会注入 NODE_AUTH_TOKEN，
      # npm 走传统 token 认证而不是 OIDC 交换，直接 ENEEDAUTH。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Upgrade npm
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test

      # prepublishOnly 会再跑 clean + build + test。
      - name: Publish (OIDC trusted publishing + provenance)
        run: npm publish --access public --provenance
